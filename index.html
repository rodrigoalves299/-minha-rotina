<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>Meu Dia</title>
<style>
:root{
  --bg:#0f1412;--panel:#18201d;--panel2:#1f2925;--ink:#eef3f0;--muted:#8fa29a;--line:#2a3631;
  --cross:#f08a4b;--musc:#5aa9e6;--eng:#7ccf9f;--sleep:#8e86d9;--rest:#c7b37a;--work:#6c7a74;
}
*{box-sizing:border-box;margin:0}
html,body{height:100%}
body{background:var(--bg);color:var(--ink);font:16px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.wrap{height:100vh;display:grid;grid-template-columns:1.1fr 1fr;grid-template-rows:auto minmax(0,1fr) auto;gap:14px;padding:18px}
header{grid-column:1/-1;display:flex;justify-content:space-between;align-items:flex-end;gap:12px;flex-wrap:wrap}
.clock{font-size:clamp(44px,6vw,72px);font-weight:700;letter-spacing:-.02em;font-variant-numeric:tabular-nums;line-height:1}
.date{font-size:clamp(17px,2vw,24px);color:var(--muted)}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:22px;padding:20px;min-height:0;overflow:auto}
.label{font-size:13px;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.now{display:flex;flex-direction:column;gap:10px}
.now>*{flex:none}
.now .title{font-size:clamp(28px,3.6vw,44px);font-weight:700;line-height:1.1}
.now .time{font-size:clamp(18px,2vw,24px);color:var(--muted);font-variant-numeric:tabular-nums}
.bar{flex:none;height:12px;border-radius:99px;background:var(--panel2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px;background:var(--c,var(--eng));transition:width .6s}
.left-note{font-size:18px;color:var(--muted)}
.next{border-top:1px solid var(--line);padding-top:14px;display:flex;gap:12px;align-items:center}
.next b{font-size:20px}
.dot{width:14px;height:14px;border-radius:50%;flex:none;background:var(--c)}
.focus{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:4px}
.chip{background:var(--panel2);border-radius:16px;padding:14px 16px;border-left:6px solid var(--c)}
.chip .k{font-size:12px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.06em}
.chip .v{font-size:18px;font-weight:600;margin-top:4px}
.side{display:flex;flex-direction:column;gap:6px;overflow:auto}
.row{display:grid;grid-template-columns:70px 1fr;gap:10px;align-items:center;padding:6px 10px;border-radius:10px}
.row .t{font-variant-numeric:tabular-nums;color:var(--muted);font-size:15px}
.row .a{display:flex;align-items:center;gap:10px;font-size:16px}
.row.past{opacity:.38}
.row.cur{background:var(--panel2);box-shadow:inset 4px 0 0 var(--c)}
.row.cur .t{color:var(--ink);font-weight:700}
.list{margin-top:12px;display:grid;grid-template-columns:1fr 1fr;gap:6px 16px;font-size:15px}
.list div{display:flex;justify-content:space-between;gap:8px;border-bottom:1px dashed var(--line);padding:4px 0}
.list span{color:var(--muted);white-space:nowrap}
.week{grid-column:1/-1;display:grid;grid-template-columns:repeat(7,1fr);gap:10px}
.day{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:10px 12px;display:flex;flex-direction:column;gap:4px}
.day.today{border-color:var(--ink);box-shadow:0 0 0 1px var(--ink)}
.day .d{font-weight:700;font-size:15px}
.day .tr{font-size:14px;font-weight:600;color:var(--c)}
.day .en{font-size:13px;color:var(--muted)}
.btn{background:var(--panel2);color:var(--muted);border:1px solid var(--line);border-radius:99px;padding:8px 14px;font:inherit;font-size:14px;cursor:pointer}
.btn.on{color:var(--eng);border-color:var(--eng)}
@media (max-width:820px){.wrap{grid-template-columns:1fr;height:auto}.panel{overflow:visible}.week{grid-template-columns:repeat(2,1fr)}.week .day:last-child{grid-column:1/-1}}
body.poster .now-panel,body.poster .side-panel,body.poster .btn,body.poster .clock,body.poster .date{display:none}
body.poster .wrap{grid-template-rows:auto auto auto;height:auto}
body.poster .week{align-items:stretch}
body.poster .day{padding:16px;gap:10px}
body.poster .day .d{font-size:22px}
.ptitle{display:none;font-size:34px;font-weight:700}
body.poster .ptitle{display:block}
body.poster .poster-legend{display:flex}
.pblk{border-left:4px solid var(--c);padding:2px 0 2px 10px}
.pblk .k{font-size:12px;color:var(--muted);font-weight:600;letter-spacing:.05em;text-transform:uppercase}
.pblk .v{font-size:16px;font-weight:600;margin-top:2px}
.pfi{font-size:14px;color:var(--muted);display:flex;flex-direction:column;gap:3px;margin-top:2px}
.pfi div{display:flex;justify-content:space-between;gap:6px;border-bottom:1px dashed var(--line);padding-bottom:2px}
.poster-legend{display:none;grid-column:1/-1;gap:22px;color:var(--muted);font-size:16px;flex-wrap:wrap}
.poster-legend span{display:flex;align-items:center;gap:8px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div>
      <div class="ptitle">Minha semana</div>
      <div class="clock" id="clock">--:--</div>
      <div class="date" id="date"></div>
    </div>
    <button class="btn" id="wake">Manter tela ligada</button>
  </header>

  <section class="panel now now-panel">
    <div class="label">Agora</div>
    <div class="title" id="nowTitle"></div>
    <div class="time" id="nowTime"></div>
    <div class="bar"><i id="nowBar"></i></div>
    <div class="left-note" id="nowLeft"></div>
    <div class="focus" id="focus"></div>
    <div class="next" id="next"></div>
    <div id="extra"></div>
  </section>

  <section class="panel side side-panel">
    <div class="label" id="sideLabel">Hoje</div>
    <div id="timeline"></div>
  </section>

  <div class="poster-legend">
    <span><i class="dot" style="--c:var(--cross)"></i>Cross training 17:00 – 18:00</span>
    <span><i class="dot" style="--c:var(--musc)"></i>Musculação 17:00 – 18:00</span>
    <span><i class="dot" style="--c:var(--eng)"></i>Inglês 18:30 – 19:40</span>
    <span><i class="dot" style="--c:var(--sleep)"></i>Sono 09:00 – 16:00</span>
    <span><i class="dot" style="--c:var(--muted)"></i>Saída para o trabalho 19:45</span>
  </div>
  <div class="week" id="week"></div>
</div>

<script>
const WEEK=[ // 0 = domingo
 {d:"Domingo",tr:"Descanso",type:"rest",en:"Revisão da semana (30 min)"},
 {d:"Segunda",tr:"Cross training",type:"cross",en:"Vocabulário + gramática"},
 {d:"Terça",tr:"Musculação A",type:"musc",en:"Listening com transcrição"},
 {d:"Quarta",tr:"Cross training",type:"cross",en:"Speaking com outra pessoa"},
 {d:"Quinta",tr:"Musculação B",type:"musc",en:"Reading + writing"},
 {d:"Sexta",tr:"Cross training",type:"cross",en:"Speaking sozinho + revisão"},
 {d:"Sábado",tr:"Descanso",type:"rest",en:"Livre"}
];
const FICHA={
 A:[["Leg press","3 × 12"],["Supino na máquina","3 × 10"],["Puxada frontal","3 × 10"],["Cadeira flexora","3 × 12"],["Elevação lateral","3 × 12"],["Prancha","3 × 20–30 s"],["Bike ou esteira","10–15 min"]],
 B:[["Cadeira extensora","3 × 12"],["Remada baixa","3 × 10"],["Desenvolvimento","3 × 10"],["Elevação pélvica","3 × 12"],["Rosca direta","3 × 12"],["Tríceps na polia","3 × 12"],["Abdominal máquina","3 × 15"],["Bike ou esteira","10–15 min"]]
};
const C={cross:"var(--cross)",musc:"var(--musc)",eng:"var(--eng)",sleep:"var(--sleep)",rest:"var(--rest)",work:"var(--work)",other:"var(--muted)"};
const m=(h,mi)=>h*60+mi;
function dayBlocks(w){
  return [
   [0,m(6,50),"Trabalho","work"],
   [m(6,50),m(8,20),"Volta: flashcards (15 min) e descanso","eng"],
   [m(8,20),m(9,0),"Chegada, lanche leve, quarto escuro","other"],
   [m(9,0),m(16,0),"Sono","sleep"],
   [m(16,0),m(16,40),"Acordar, café e lanche pré-treino","other"],
   [m(16,40),m(17,0),"Ida ao treino","other"],
   [m(17,0),m(18,0),w.tr,w.type],
   [m(18,0),m(18,30),"Volta, banho e refeição","other"],
   [m(18,30),m(19,40),"Inglês: "+w.en,"eng"],
   [m(19,40),m(20,30),"Jantar e saída (levar a comida do turno)","other"],
   [m(20,30),m(22,0),"Ida: listening ou descanso","eng"],
   [m(22,0),m(24,0),"Trabalho","work"]
  ];
}
function weekendBlocks(dow){
  const b=[[0,m(24,0),"Descanso e compromissos sociais","rest"]];
  if(dow===0)b.splice(0,1,[0,m(18,0),"Descanso e compromissos sociais","rest"],[m(18,0),m(18,30),"Revisão da semana e pesagem","eng"],[m(18,30),m(24,0),"Descanso","rest"]);
  return b;
}
const fmt=x=>String(Math.floor(x/60)%24).padStart(2,"0")+":"+String(x%60).padStart(2,"0");
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));

function render(){
  const now=new Date(),dow=now.getDay(),mins=now.getHours()*60+now.getMinutes();
  const w=WEEK[dow],weekend=(dow===0||dow===6);
  document.getElementById("clock").textContent=fmt(mins);
  const ds=now.toLocaleDateString("pt-BR",{weekday:"long",day:"numeric",month:"long"});document.getElementById("date").textContent=ds.charAt(0).toUpperCase()+ds.slice(1);
  const blocks=weekend?weekendBlocks(dow):dayBlocks(w);
  let i=blocks.findIndex(b=>mins>=b[0]&&mins<b[1]);if(i<0)i=0;
  const cur=blocks[i],nx=blocks[i+1];
  const pct=Math.round((mins-cur[0])/(cur[1]-cur[0])*100),left=cur[1]-mins;
  document.getElementById("nowTitle").textContent=cur[2];
  document.getElementById("nowTime").textContent=fmt(cur[0])+" – "+fmt(cur[1]);
  const bar=document.getElementById("nowBar");bar.style.width=pct+"%";bar.style.setProperty("--c",C[cur[3]]);
  document.getElementById("nowLeft").textContent=left>=60?`Faltam ${Math.floor(left/60)}h${String(left%60).padStart(2,"0")}`:`Faltam ${left} min`;
  document.getElementById("next").innerHTML=nx?`<i class="dot" style="--c:${C[nx[3]]}"></i><div><div class="label">Depois, às ${fmt(nx[0])}</div><b>${esc(nx[2])}</b></div>`:"";
  document.getElementById("focus").innerHTML=weekend?
    `<div class="chip" style="--c:${C.rest}"><div class="k">Hoje</div><div class="v">Descanso</div></div><div class="chip" style="--c:${C.eng}"><div class="k">Inglês</div><div class="v">${esc(w.en)}</div></div>`:
    `<div class="chip" style="--c:${C[w.type]}"><div class="k">Treino 17:00</div><div class="v">${esc(w.tr)}</div></div><div class="chip" style="--c:${C.eng}"><div class="k">Inglês 18:30</div><div class="v">${esc(w.en)}</div></div>`;
  document.getElementById("timeline").innerHTML=blocks.filter(b=>b[1]-b[0]>0).map((b,j)=>
    `<div class="row ${j<i?"past":j===i?"cur":""}" style="--c:${C[b[3]]}"><span class="t">${fmt(b[0])}</span><span class="a"><i class="dot" style="--c:${C[b[3]]}"></i>${esc(b[2])}</span></div>`).join("");
  let extra="";
  if(w.type==="musc"){const k=w.tr.slice(-1);extra=`<div class="label" style="margin-top:4px">Ficha do treino ${k}</div><div class="list">${FICHA[k].map(f=>`<div>${f[0]}<span>${f[1]}</span></div>`).join("")}</div>`;}
  else if(w.type==="cross"){extra=`<div class="label" style="margin-top:4px">Lembrete do cross</div><div class="left-note" style="margin-top:6px">Peça as versões adaptadas (sem salto, menos carga). Dor na articulação: pare e avise o coach.</div>`;}
  else if(dow===0){extra=`<div class="label" style="margin-top:4px">Revisão de domingo</div><div class="left-note" style="margin-top:6px">Flashcards pendentes · tópicos de inglês · peso e cintura · agendar as aulas da semana</div>`;}
  document.getElementById("extra").innerHTML=extra;
  const order=[1,2,3,4,5,6,0],poster=document.body.classList.contains("poster");
  document.getElementById("week").innerHTML=order.map(k=>{const x=WEEK[k];
    if(!poster)return `<div class="day ${k===dow?"today":""}" style="--c:${C[x.type]}"><div class="d">${x.d}</div><div class="tr">${esc(x.tr)}</div><div class="en">${esc(x.en)}</div></div>`;
    const wk=(k===0||k===6);
    let h=`<div class="day" style="--c:${C[x.type]}"><div class="d">${x.d}</div>`;
    if(wk){h+=`<div class="pblk" style="--c:${C.rest}"><div class="k">Dia todo</div><div class="v">Descanso e compromissos sociais</div></div>`;
      if(k===0)h+=`<div class="pblk" style="--c:${C.eng}"><div class="k">30 min</div><div class="v">Revisão da semana</div></div><div class="pfi"><div>Flashcards pendentes</div><div>Tópicos de inglês</div><div>Peso e cintura</div><div>Agendar as aulas</div></div>`;
    }else{
      h+=`<div class="pblk" style="--c:${C[x.type]}"><div class="k">17:00 – 18:00</div><div class="v">${esc(x.tr)}</div></div>`;
      if(x.type==="musc")h+=`<div class="pfi">${FICHA[x.tr.slice(-1)].map(f=>`<div>${f[0]}<span>${f[1]}</span></div>`).join("")}</div>`;
      else h+=`<div class="pfi"><div>Versões adaptadas, sem salto</div></div>`;
      h+=`<div class="pblk" style="--c:${C.eng}"><div class="k">18:30 – 19:40 · Inglês</div><div class="v">${esc(x.en)}</div></div>`;
    }
    return h+`</div>`}).join("");
}
if(new URLSearchParams(location.search).get("modo")==="semana")document.body.classList.add("poster");
render();setInterval(render,30000);

let lock=null;const wb=document.getElementById("wake");
wb.onclick=async()=>{try{if(lock){await lock.release();lock=null;wb.classList.remove("on");wb.textContent="Manter tela ligada";return}
  lock=await navigator.wakeLock.request("screen");wb.classList.add("on");wb.textContent="Tela ligada";
  lock.addEventListener("release",()=>{lock=null;wb.classList.remove("on");wb.textContent="Manter tela ligada"})}catch(e){wb.textContent="Não suportado aqui"}};
document.addEventListener("visibilitychange",async()=>{if(wb.classList.contains("on")&&!lock&&document.visibilityState==="visible"){try{lock=await navigator.wakeLock.request("screen")}catch(e){}}});
</script>
</body>
</html>
